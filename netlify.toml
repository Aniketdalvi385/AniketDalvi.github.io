# Netlify build configuration.
#
# This file takes precedence over the settings in the Netlify UI, so the values
# here are the source of truth. The dashboard was still carrying the Create
# React App configuration after the migration to Astro — notably a `build`
# publish directory, which no longer exists and failed every deploy.

[build]
  command = "npm run build"
  # Astro emits `dist/`. CRA emitted `build/`; that is the migration trap.
  publish = "dist"

[build.environment]
  # Astro 7 requires >=22.12.0 (so does this package's `engines` field), and
  # Netlify's default image pins an older major. Without this the install fails
  # the engine check before the build starts.
  NODE_VERSION = "22.12.0"

# `astro check` runs as part of `npm run build`, so a type error fails the
# deploy rather than shipping a broken page. That is deliberate — see CLAUDE.md.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    # Astro fingerprints filenames in /_astro/, so these are safe to cache
    # permanently — a content change produces a new filename.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    # HTML must revalidate, or visitors keep an old page that references
    # hashed assets which no longer exist.
    Cache-Control = "public, max-age=0, must-revalidate"
